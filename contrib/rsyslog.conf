
# 1. Firewall
if $msg contains "firewall: " then -/var/log/iptables.log
& stop

# 2. Log der ESP32 Sketche (MQTT <topic-base>/log), vom Daemon mit Facility local0 geschrieben
if $programname contains "<TARGET>" and $syslogfacility-text == "local0" then -/var/log/esp.log
& stop

# 3. Daemon  Haupt-Log
if $programname contains "<TARGET>" then -/var/log/<TARGET>.log
& stop

# 4. Alle MQTT-Dienste gesammelt per rexex

if $programname contains "victronmqtt"
   or $programname contains "votromqtt"
   or $programname contains "bmsmqtt"
   or $programname contains "w1mqtt"
   or $programname contains "mopekamqtt"
   or $programname contains "thetfordmqtt"
   or $programname contains "sensormqtt"
   or $programname contains "i2cmqtt"
   or $programname contains "alpicoolmqtt"
   or $programname contains "gpsmqtt"
then -/var/log/sensormqtt.log
& stop
