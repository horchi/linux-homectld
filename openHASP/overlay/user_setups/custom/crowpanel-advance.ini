;***************************************************;
;  Elecrow CrowPanel Advance 5.0" HMI (ESP32-S3)    ;
;    - ESP32-S3-WROOM-1-N16R8 (16MB flash, 8MB PSRAM)
;    - 800x480 RGB panel, GT911 touch on I2C 15/16   ;
;    - Backlight via board MCU (I2C 0x30), not GPIO  ;
;  Pinout taken from Elecrow LovyanGFX_Driver.h     ;
;  (identical for board revisions V1.0 .. V1.3)     ;
;***************************************************;

[env:elecrow-advance-s3-8048c050_16MB]
extends = elecrow-esp32-s3-tft, flash_16mb

build_flags =
    -D HASP_MODEL="Elecrow CrowPanel Advance 5.0"

    ; base flags (like elecrow-esp32-s3-tft, but without TFT_BCKL: no GPIO backlight on this board)
    ${arduino_esp32s3_v2.build_flags}
    ${esp32s3.ps_ram}
    -D HASP_LV_USE_SW_ROTATE=0

    ; Backlight via on-board MCU (STC8H1K28) on the touch I2C bus: 0 = brightest .. 245 = off
    -D HASP_BACKLIGHT_I2C_ADDR=0x30
    -D HASP_BACKLIGHT_I2C_PORT=0
    -D HASP_BACKLIGHT_I2C_SDA=15
    -D HASP_BACKLIGHT_I2C_SCL=16
    -D HASP_BACKLIGHT_I2C_FREQUENCY=100000
    -D HASP_BACKLIGHT_I2C_WAKE_PIN=1
    -D HASP_BUZZER_I2C_ON_CMD=246
    -D HASP_BUZZER_I2C_OFF_CMD=247
    -D HASP_USE_CUSTOM=1

    ; Panel Settings
    -D TFT_WIDTH=800
    -D TFT_HEIGHT=480

    ; Bus Settings - LovyanGFX Library
    -D LGFX_USE_V1=1
    -D RGB_DRIVER=1

    -D TFT_DE=42
    -D TFT_VSYNC=41
    -D TFT_HSYNC=40
    -D TFT_PCLK=39

    -D TFT_R0=7
    -D TFT_R1=17
    -D TFT_R2=18
    -D TFT_R3=3
    -D TFT_R4=46

    -D TFT_G0=9
    -D TFT_G1=10
    -D TFT_G2=11
    -D TFT_G3=12
    -D TFT_G4=13
    -D TFT_G5=14

    -D TFT_B0=21
    -D TFT_B1=47
    -D TFT_B2=48
    -D TFT_B3=45
    -D TFT_B4=38

    -D TFT_HSYNC_POLARITY=0
    -D TFT_HSYNC_FRONT_PORCH=8
    -D TFT_HSYNC_PULSE_WIDTH=4
    -D TFT_HSYNC_BACK_PORCH=8
    -D TFT_VSYNC_POLARITY=0
    -D TFT_VSYNC_FRONT_PORCH=8
    -D TFT_VSYNC_PULSE_WIDTH=4
    -D TFT_VSYNC_BACK_PORCH=8
    -D TFT_PCLK_ACTIVE_NEG=1
    -D TFT_PREFER_SPEED=16000000
    -D TFT_AUTO_FLUSH=1

    ; Touch Settings (GT911)
    -D HASP_USE_LGFX_TOUCH=1
    -D TOUCH_WIDTH=800
    -D TOUCH_HEIGHT=480
    -D TOUCH_DRIVER=0x911
    -D TOUCH_SDA=15
    -D TOUCH_SCL=16
    -D TOUCH_IRQ=-1
    -D TOUCH_RST=-1
    -D I2C_TOUCH_ADDRESS=0x5D
    -D I2C_TOUCH_FREQUENCY=400000

lib_deps =
    ${elecrow-esp32-s3-tft.lib_deps}
